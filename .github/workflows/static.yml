

name: Deploy React App to Personal GitHub Page (Selective Cleanup)

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./react
        run: npm install

      - name: Build React app
        working-directory: ./react
        run: npm run build

      - name: Remove old build files from root
        run: |
          rm -rf index.html
          rm -rf vite.svg
          rm -rf assets

      - name: Copy new build to root
        run: |
          cp -r react/dist/* .

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy: update site files" || echo "No changes to commit"
          git push origin master




