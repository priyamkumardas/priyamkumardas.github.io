name: Build and Push to Master

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source (dev)
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./react
        run: npm install

      - name: Build React app
        working-directory: ./react
        run: npm run build

      - name: Clone master branch
        run: |
          git clone --branch master https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} master-temp
          # rm -rf master-temp/*
          rm -rf master-temp/index.html
          rm -rf master-temp/vite.svg
          rm -rf master-temp/assets
          cp -r react/dist/* master-temp/

      - name: Push to master branch
        run: |
          cd master-temp
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy: build from dev to master" || echo "No changes to commit"
          git push origin master




